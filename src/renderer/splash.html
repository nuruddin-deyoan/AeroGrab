<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AeroGrab</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        background: transparent;
      }

      body {
        font-family: 'Space Grotesk Variable', 'Segoe UI', system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-app-region: drag;
        user-select: none;
        overflow: hidden;
      }

      .splash-card {
        width: 100%;
        height: 100%;
        background: #111111;
        border: 1px solid #2a2a2a;
        border-radius: 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 32px;
        text-align: center;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        animation: splash-in 350ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      @keyframes splash-in {
        from {
          opacity: 0;
          transform: scale(0.96);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      .splash-logo {
        filter: drop-shadow(0 0 16px rgba(34, 197, 94, 0.4));
        animation: logo-pulse 2s ease-in-out infinite;
      }

      @keyframes logo-pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.06);
        }
      }

      .splash-title {
        font-size: 20px;
        font-weight: 600;
        color: #e8e8e8;
        letter-spacing: 0.01em;
      }

      .splash-tagline {
        font-size: 13px;
        color: #999999;
      }

      .splash-track {
        width: 220px;
        height: 4px;
        background: #2a2a2a;
        border-radius: 9999px;
        overflow: hidden;
        margin-top: 14px;
      }

      .splash-fill {
        height: 100%;
        width: 40%;
        background: #22c55e;
        border-radius: 9999px;
        box-shadow: 0 0 8px rgba(34, 197, 94, 0.9);
        animation: splash-slide 1.1s ease-in-out infinite;
      }

      @keyframes splash-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(300%);
        }
      }

      .splash-status {
        font-size: 12px;
        color: #666666;
        min-height: 18px;
      }

      .splash-status.is-error {
        color: #ef4444;
      }

      .splash-version {
        position: absolute;
        bottom: 14px;
        font-size: 11px;
        font-family: monospace;
        color: #444444;
      }
    </style>
  </head>
  <body>
    <div class="splash-card">
      <svg class="splash-logo" width="52" height="52" viewBox="0 0 24 24" fill="none">
        <defs>
          <linearGradient id="splash-logo-grad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#4ADE80" />
            <stop offset="1" stop-color="#16A34A" />
          </linearGradient>
        </defs>
        <rect x="1.5" y="1.5" width="21" height="21" rx="6" fill="url(#splash-logo-grad)" />
        <path d="M10 8.5l6 3.5-6 3.5z" fill="#fff" />
      </svg>
      <div class="splash-title">AeroGrab</div>
      <div class="splash-tagline">Fast, simple YouTube downloads</div>
      <div class="splash-track">
        <div class="splash-fill"></div>
      </div>
      <div class="splash-status" id="splash-status">Starting…</div>
      <div class="splash-version">v1.0.0</div>
    </div>
    <script>
      window.addEventListener('DOMContentLoaded', () => {
        const statusEl = document.getElementById('splash-status')
        if (window.api && typeof window.api.onSplashStatus === 'function') {
          window.api.onSplashStatus((message, isError) => {
            if (statusEl) {
              statusEl.textContent = message
              statusEl.classList.toggle('is-error', !!isError)
            }
          })
        }
      })
    </script>
  </body>
</html>
